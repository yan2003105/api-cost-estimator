<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenAI API 成本估算器</title>
<style>body{font-family:system-ui,"PingFang SC",sans-serif;max-width:680px;margin:0 auto;padding:20px;background:#f7f7f5}input{width:100%;padding:8px;margin:4px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:14px;margin:12px 0}button{background:#111;color:#fff;border:0;border-radius:8px;padding:8px 14px}.muted{color:#888;font-size:13px}</style></head>
<body><h1>OpenAI API 成本估算器</h1><p class="muted">非官方工具，与 OpenAI 无关。价格要你自己填，因为官方价格会变，工具不自动拉价格、不登录、不要 API Key，计算只在浏览器里做。</p>
<div class="card"><label>输入 token 数 <input id="in" type="number" value="100000"></label><label>输出 token 数 <input id="out" type="number" value="20000"></label><label>输入价（每 100 万 token，美元）<input id="pin" type="number" step="0.01" value="1"></label><label>输出价（每 100 万 token，美元）<input id="pout" type="number" step="0.01" value="4"></label><button onclick="calc()">算一下</button><p id="r"></p></div>
<script>function calc(){const i=+in.value||0,o=+out.value||0,pi=+pin.value||0,po=+pout.value||0;const c=i/1e6*pi+o/1e6*po;r.textContent='预计成本：$'+c.toFixed(4)+'（输入 $'+(i/1e6*pi).toFixed(4)+' + 输出 $'+(o/1e6*po).toFixed(4)+'），仅供预算参考，以官方账单为准。';}calc();</script></body></html>
