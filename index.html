<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenAI API Cost Estimator</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:0 auto;padding:20px;background:#f7f7f5}input{width:100%;padding:8px;margin:4px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:14px;margin:12px 0}button{background:#111;color:#fff;border:0;border-radius:8px;padding:8px 14px}.muted{color:#888;font-size:13px}</style></head>
<body><h1>OpenAI API Cost Estimator</h1><p class="muted">Unofficial tool, not affiliated with OpenAI. Enter prices yourself, because official prices change. No login, no API key, calculation happens only in your browser.</p>
<div class="card"><label>Input tokens <input id="in" type="number" value="100000"></label><label>Output tokens <input id="out" type="number" value="20000"></label><label>Input price (USD per 1M tokens) <input id="pin" type="number" step="0.01" value="1"></label><label>Output price (USD per 1M tokens) <input id="pout" type="number" step="0.01" value="4"></label><button onclick="calc()">Calculate</button><p id="r"></p></div>
<script>function calc(){const i=+in.value||0,o=+out.value||0,pi=+pin.value||0,po=+pout.value||0;const c=i/1e6*pi+o/1e6*po;r.textContent='Estimated cost: $'+c.toFixed(4)+' (input $'+(i/1e6*pi).toFixed(4)+' + output $'+(o/1e6*po).toFixed(4)+'). For budgeting only; the official bill is authoritative.';}calc();</script></body></html>
